name: Quarto alt text linter
description: Lint Quarto .qmd files for missing image alt text
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Checkout action repo
      uses: actions/checkout@v4
      with:
        repository: lintquarto/alt-text-linter
        ref: main
        path: .github/actions/alt-text-linter

    - name: Run alt text linter
      shell: bash
      run: python .github/actions/alt-text-linter/lint_alt_text.py