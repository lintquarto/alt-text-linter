name: Quarto alt text linter
description: Lint Quarto .qmd files for missing image alt text

inputs:
  path:
    description: Path in the caller repo to lint
    required: false
    default: ${{ github.workspace }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Run alt text linter
      shell: bash
      run: |
        python "${{ github.action_path }}/alt_text_linter.py" "${{ inputs.path }}"